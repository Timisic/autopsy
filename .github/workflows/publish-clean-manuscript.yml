name: Publish clean bilingual manuscript
on:
  push:
    branches: [publish/clean-manuscript-20260924]
    paths: [.delivery/payload.b64]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-chinese texlive-fonts-recommended fonts-liberation fonts-liberation2 poppler-utils
      - name: Assemble the clean publication tree
        run: python3 .delivery/install.py
      - name: Compile all six documents
        run: bash build.sh
      - name: Verify and record the publication
        run: python3 .delivery/check_publish.py || { cat trace/repository_checks.json; exit 1; }
      - name: Verify staged bytes and commit publication
        run: python3 .delivery/publish.py
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-diagnostics
          retention-days: 3
          include-hidden-files: true
          path: |
            .build/**/*.log
            en/*.pdf
            zh/*.pdf
            trace/repository_checks.json
