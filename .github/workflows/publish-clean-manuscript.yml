name: Publish clean bilingual manuscript
on:
  push:
    branches: [publish/clean-manuscript-20260924]
    paths: [.delivery/payload.b64]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-chinese fonts-liberation fonts-liberation2 poppler-utils
      - name: Assemble the clean publication tree
        run: python3 .delivery/install.py
      - name: Compile all six documents
        run: bash build.sh
      - name: Verify and record the publication
        run: python3 .delivery/check_publish.py
      - name: Commit the verified publication
        run: |
          rm -rf .delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish clean bilingual LaTeX and PDF manuscripts; archive research trace'
          git push origin HEAD:publish/clean-manuscript-20260924
